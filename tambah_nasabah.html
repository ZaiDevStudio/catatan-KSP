<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tambah Nasabah - KSP Online</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="header-container">
            <div class="logo-area">
                <img src="KSP.png" alt="Logo">
                <h1>KSP ONLINE</h1>
            </div>
            <div class="menu-toggle" onclick="toggleMenu()">&#9776;</div>
            <nav id="navMenu" class="nav-menu">
               <a href="tambah_nasabah.html">Tambah Nasabah</a>
               <a href="index.html">Data Nasabah</a>
               <a href="tambah_pinjaman.html">Tambah Pinjaman</a>
               <a href="pinjaman.html">Data Pinjaman</a>
               <a href="pembayaran.html">Pembayaran</a>
               <a href="tabungan.html">Tabungan</a>
               <a href="saldo.html">Rekapan Saldo</a>
               <a href="bukti.html">Bukti Pembayaran</a>
            </nav>
        </div>
    </header>

    <main>
        <h2>Tambah Nasabah Baru</h2>
        <form id="formTambahNasabah" style="background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1);">
            <div class="form-group">
                <label>Nama Lengkap</label>
                <input type="text" id="nama" required>
            </div>
            <div class="form-group">
                <label>Jenis Usaha</label>
                <input type="text" id="usaha" required>
            </div>
            <div class="form-group">
                <label>Tempat Usaha</label>
                <input type="text" id="tempat" required>
            </div>
            <div class="form-group">
                <label>Alamat Rumah</label>
                <input type="text" id="alamat" required>
            </div>
            <div class="form-group">
                <label>No HP/WA</label>
                <input type="number" id="hp" required>
            </div>
            <button type="submit" class="btn-primary">Simpan Data Nasabah</button>
        </form>
    </main>

    <footer>
        &copy; 2025 Koperasi Simpan Pinjam. Developer Y. Zai, A.Md.Kom
    </footer>
    <div id="licenseModal"><h2>Aplikasi Terkunci</h2><p>Hubungi Developer.</p></div>
    <script src="script.js"></script>
</body>
</html>
