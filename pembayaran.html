<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pembayaran - KSP Online</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="header-container">
            <div class="logo-area"><img src="KSP.png" alt="Logo"><h1>KSP ONLINE</h1></div>
            <div class="menu-toggle" onclick="toggleMenu()">&#9776;</div>
            <nav id="navMenu" class="nav-menu">
               <a href="tambah_nasabah.html">Tambah Nasabah</a>
               <a href="index.html">Data Nasabah</a>
               <a href="tambah_pinjaman.html">Tambah Pinjaman</a>
               <a href="pinjaman.html">Data Pinjaman</a>
               <a href="pembayaran.html">Pembayaran</a>
               <a href="tabungan.html">Tabungan</a>
               <a href="saldo.html">Rekapan Saldo</a>
               <a href="bukti.html">Bukti Pembayaran</a>
            </nav>
        </div>
    </header>

    <main>
        <h2>Pembayaran Nasabah</h2>
        <div style="background: white; padding: 20px; border-radius: 8px;">
            <div class="form-group">
                <label>Cari Nama Nasabah</label>
                <div style="display: flex; gap: 10px;">
                    <input type="text" id="cariNamaBayar" placeholder="Masukkan nama...">
                    <button class="btn-primary" id="btnCariBayar" style="width: auto;">Cari</button>
                </div>
            </div>
            
            <div id="hasilCariBayar" style="display: none; border-top: 1px solid #ccc; margin-top: 20px; padding-top: 20px;">
                <h3>Rincian Tagihan: <span id="labelNama" style="color:var(--primary-color)"></span></h3>
                <p>Sisa Saldo Pinjaman: <strong id="labelSisa"></strong></p>
                <p>Sisa Angsuran: <strong id="labelAngsuran"></strong> x</p>
                <br>
                <div class="form-group">
                    <label>Jumlah Bayar (Rp)</label>
                    <input type="number" id="inputBayar">
                </div>
                <button class="btn-primary" id="btnProsesBayar" style="background: #198754;">BAYAR SEKARANG</button>
            </div>
        </div>
    </main>

    <footer>&copy; 2025 Koperasi Simpan Pinjam. Developer Y. Zai, A.Md.Kom</footer>
    <div id="licenseModal"><h2>Aplikasi Terkunci</h2><p>Hubungi Developer.</p></div>
    <script src="script.js"></script>
</body>
</html>
