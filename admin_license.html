<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Admin License</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main style="max-width: 400px; margin-top: 100px;">
        <h2>Pengaturan Lisensi</h2>
        <div class="form-group">
            <label>Masukkan Kode Lisensi Baru:</label>
            <input type="text" id="newLicense">
        </div>
        <button class="btn-primary" onclick="setLicense()">Simpan Lisensi ke HP Ini</button>
    </main>
    <script>
        function setLicense() {
            const key = document.getElementById('newLicense').value;
            localStorage.setItem('ksp_license_key', key);
            alert('Lisensi tersimpan!');
        }
    </script>
</body>
</html>
